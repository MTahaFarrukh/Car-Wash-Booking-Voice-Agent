# Render blueprint — Sparkle FastAPI (Phase 10B)
# Docs: https://render.com/docs/blueprint-spec
# Secrets use sync: false — set them in the Render Dashboard / CLI (never commit values).

services:
  - type: web
    name: sparkle-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: WHATSAPP_AGENT_MODE
        value: auto
      - key: VOICE_PROVIDER
        value: vapi
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_BRIDGE_SECRET
        sync: false
      - key: VOICE_WEBHOOK_SECRET
        sync: false
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: VAPI_WEBHOOK_SECRET
        sync: false
